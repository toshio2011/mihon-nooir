name: One-time Android guide asset import
on:
  push:
    branches: [docs/one-time-android-screenshot-import-20261126]
    paths: ['.github/workflows/one-time-android-screenshot-import.yml']
permissions:
  actions: read
  contents: write
jobs:
  import:
    if: github.repository == 'toshio2011/mihon-nooir' && github.ref == 'refs/heads/docs/one-time-android-screenshot-import-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import exact reviewed Android release-source QA images
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=docs/android-v1.0.20-visual-guide-20261126
          base=c2237fb6f6c91903f0e418d5c5cee1f7c9f5b86a
          cp docs/ANDROID_VISUAL_GUIDE.md docs/android-screenshot-import.sha256 "$RUNNER_TEMP/"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14901798319/zip" > "$RUNNER_TEMP/screens.zip"
          git fetch origin "$target"
          test "$(git rev-parse FETCH_HEAD)" = "$base"
          git checkout --detach "$base"
          cp "$RUNNER_TEMP/ANDROID_VISUAL_GUIDE.md" docs/
          python - <<'PY'
          import os, pathlib, zipfile, hashlib, re
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          out=pathlib.Path("docs/screenshots/android-v1.0.20")
          out.mkdir(parents=True,exist_ok=True)
          manifest=(tmp/"android-screenshot-import.sha256").read_text()
          with zipfile.ZipFile(tmp/"screens.zip") as z:
              for line in manifest.splitlines():
                  digest,name=line.split()
                  assert re.fullmatch(r"[a-z0-9-]+\.png",name)
                  data=z.read(name)
                  assert data.startswith(b"\x89PNG\r\n\x1a\n") and hashlib.sha256(data).hexdigest()==digest
                  (out/name).write_bytes(data)
          (out/"SHA256SUMS").write_text(manifest)
          links=re.findall(r"\]\((screenshots/[^)]+\.png)\)",pathlib.Path("docs/ANDROID_VISUAL_GUIDE.md").read_text())
          assert len(links)==8
          for link in links:
              assert (pathlib.Path("docs")/link).is_file(),link
          PY
          git add -- docs/ANDROID_VISUAL_GUIDE.md docs/screenshots/android-v1.0.20/
          test -z "$(git diff --cached --name-only | grep -vE '^docs/(ANDROID_VISUAL_GUIDE\.md|screenshots/android-v1\.0\.20/([a-z0-9-]+\.png|SHA256SUMS))$' || true)"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Docs: embed eight verified Android v1.0.20 release-source screenshots'
          git push origin "HEAD:refs/heads/$target"
