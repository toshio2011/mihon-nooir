name: Promote verified MihonNooir v1.0.20
# Manual-only promotion: no APK rebuild, no changes to the signing key.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage/verify a draft, or explicitly publish a verified draft
        type: choice
        options: [stage, publish]
        default: stage
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: mihonnooir-v1.0.20-official-publish
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ github.repository == 'toshio2011/mihon-nooir' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPERATION: ${{ inputs.operation }}
      RC: d70032844241b0ae5e8bab693925fb4e9edca033
      RUN_ID: '45363123609'
      ANDROID_RUN_ID: '45363200383'
      ARTIFACT_ID: '14905454241'
      ARTIFACT_DIGEST: '49ae8315e0e345ced6744ed57ebc37536227d1f98a07dea741645abd74214d3f'
      TAG: v1.0.20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm frozen source and both Android verification runs
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < config/version.txt)" = '1.0.20'
          git merge-base --is-ancestor "$RC" HEAD
          git diff --exit-code "$RC" HEAD -- . ':!README.md' ':!docs/UPDATES.md' ':!docs/releases/v1.0.20.md' ':!.github/workflows/publish-v1.0.20.yml'
          for run in "$RUN_ID" "$ANDROID_RUN_ID"; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)" = "$RC"
          done
      - name: Retrieve and validate exact signed artifact
        shell: bash
        run: |
          set -euo pipefail
          meta=$(gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID")
          jq -e --arg sha "$RC" --arg name "mihonnooir-v1.0.20-signed-upgrade-candidate" --arg digest "sha256:$ARTIFACT_DIGEST" --argjson run "$RUN_ID" '.expired == false and .name == $name and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha' <<< "$meta"
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/verified.zip"
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$RUNNER_TEMP/verified.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/verified.zip" <<'PY'
          import pathlib, re, sys, zipfile
          apks = {"app-" + abi + "-foss.apk" for abi in ("arm64-v8a", "armeabi-v7a", "universal", "x86", "x86_64")}
          names = apks | {"SHA256SUMS.txt"}
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert len(z.namelist()) == len(names) and set(z.namelist()) == names
              assert z.testzip() is None
              z.extractall("dist")
          lines = pathlib.Path("dist/SHA256SUMS.txt").read_text().splitlines()
          entries = [re.fullmatch(r"[0-9a-f]{64}  (?:\./)?(app-[\w-]+-foss\.apk)", line) for line in lines]
          assert len(entries) == 5 and all(entries) and {m.group(1) for m in entries} == apks
          PY
          (cd dist && sha256sum --strict -c SHA256SUMS.txt)
      - name: Stage new draft or verify existing draft without replacing any asset
        shell: bash
        run: |
          set -euo pipefail
          # Enumerate authenticated releases rather than interpreting arbitrary API errors as missing releases.
          releases=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100")
          matches=$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)]' <<< "$releases")
          count=$(jq length <<< "$matches")
          test "$count" -le 1
          if [[ "$count" == 0 ]]; then
            test "$OPERATION" = stage
            test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
            gh release create "$TAG" dist/*-foss.apk dist/SHA256SUMS.txt --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'MihonNooir v1.0.20 — Universal Book Converter & Web to EPUB' --notes-file docs/releases/v1.0.20.md --draft
          fi
          release=$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,tagName,targetCommitish,assets)
          jq -e --arg tag "$TAG" '.isDraft == true and .isPrerelease == false and .tagName == $tag and ([.assets[].name] | sort) == (["app-arm64-v8a-foss.apk","app-armeabi-v7a-foss.apk","app-universal-foss.apk","app-x86-foss.apk","app-x86_64-foss.apk","SHA256SUMS.txt"] | sort)' <<< "$release"
          target=$(jq -r .targetCommitish <<< "$release")
          target_sha=$(gh api "repos/$GH_REPO/commits/$target" --jq .sha)
          git merge-base --is-ancestor "$RC" "$target_sha"
          git diff --exit-code "$RC" "$target_sha" -- . ':!README.md' ':!docs/UPDATES.md' ':!docs/releases/v1.0.20.md' ':!.github/workflows/publish-v1.0.20.yml'
          # An existing tag must resolve to that exact draft target; never move a tag.
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [[ -n "$existing" ]]; then
            tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            test "$tag_sha" = "$target_sha"
          fi
          mkdir -p "$RUNNER_TEMP/uploaded"
          gh release download "$TAG" --repo "$GH_REPO" --pattern '*' --dir "$RUNNER_TEMP/uploaded"
          for file in dist/*; do
            cmp "$file" "$RUNNER_TEMP/uploaded/$(basename "$file")"
          done
          (cd "$RUNNER_TEMP/uploaded" && sha256sum --strict -c SHA256SUMS.txt)
          echo 'All six draft release assets match the original verified artifact byte for byte.'
      - name: Publish only with explicit publish operation
        if: inputs.operation == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,isPrerelease,tagName,url,assets --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v1.0.20" and (.assets | length) == 6) | .url' | grep -F '/releases/tag/v1.0.20'
