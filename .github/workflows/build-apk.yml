name: Build Mihon Nooir debug APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Keep only the latest APK build for a rapidly updated draft PR.
# Other PRs and main use separate refs and remain unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
      - name: Validate overlay structure
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate XTC, XTCH, EPUB 2, EPUB 3 and CBZ export formats
        env:
          NOOIR_OUTPUT_DIR: tests/generated
        run: |
          command -v kotlinc
          bash tests/run.sh
      - name: Retain synthetic host-verified interoperability fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manganooir-readable-reader-interop-fixtures
          path: tests/generated/*
          if-no-files-found: warn
      - name: EPUBCheck 5.4.0 on readable EPUB 2 and EPUB 3 outputs
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  $RUNNER_TEMP/epubcheck.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/epubcheck"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP/epubcheck"
          JAR=$(find "$RUNNER_TEMP/epubcheck" -name epubcheck.jar -print -quit)
          test -n "$JAR"
          java -jar "$JAR" tests/generated/MangaNooir_Readable_EPUB2_X4.epub
          java -jar "$JAR" tests/generated/MangaNooir_Readable_EPUB3_X4.epub
          java -jar "$JAR" tests/generated/MangaNooir_Reflow_EPUB3_SelectableText.epub
          java -jar "$JAR" tests/generated/MangaNooir_Reflow_EPUB2_SelectableText.epub

      - name: Read upstream pin
        id: pin
        run: echo "sha=$(cat config/mihon-upstream.sha)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Mihon upstream
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: ${{ steps.pin.outputs.sha }}
          path: upstream
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply integration
        run: python3 tools/apply_overlay.py upstream
      - name: Remove Android-wide installation capabilities
        run: python3 tools/secure_android_installers.py upstream
      - name: Verify onboarding does not call package-install permission API
        shell: bash
        run: |
          set -euo pipefail
          onboarding=upstream/app/src/main/java/eu/kanade/presentation/more/onboarding/PermissionStep.kt
          test -f "$onboarding"
          if grep -Eq 'rememberRequestPackageInstallsPermissionState|launchRequestPackageInstallsPermission|canRequestPackageInstalls|onboarding_permission_install_apps' "$onboarding"; then
            echo "Obsolete Android package-install permission check remains in onboarding"
            exit 1
          fi
          echo "Verified onboarding no longer references package-install permission APIs"
      - name: Assemble fork (FOSS APK)
        working-directory: upstream
        run: bash ./gradlew :app:assembleFoss -Pdist=foss -Pinclude-telemetry=false --no-daemon --stacktrace
      - name: Verify one-app APK identity, version, signing and archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(upstream/app/build/outputs/apk/foss/*.apk)
          (( ${#apks[@]} >= 1 )) || { echo 'No built APK found'; exit 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          tools_dir=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools_dir/apksigner" && test -x "$tools_dir/aapt"
          version=$(tr -d '\r\n' < config/version.txt)
          version_code=$(python3 -c 'import sys; a,b,c=map(int,sys.argv[1].split(".")); print(a*1000000+b*10000+c)' "$version")
          for apk in "${apks[@]}"; do
            unzip -tq "$apk" >/dev/null
            "$tools_dir/apksigner" verify --verbose --print-certs "$apk"
            badging=$("$tools_dir/aapt" dump badging "$apk")
            grep -Fq "name='dev.nooir.mihon.foss'" <<< "$badging"
            grep -Fq "versionCode='$version_code'" <<< "$badging"
            grep -Fq "versionName='$version'" <<< "$badging"
            grep -Fq "application-label:'MihonNooir'" <<< "$badging"
            merged_manifest=$("$tools_dir/aapt" dump xmltree "$apk" AndroidManifest.xml)
            for component in ShizukuProvider ExtensionInstallService ExtensionInstallActivity; do
              if grep -Fq "$component" <<< "$merged_manifest"; then
                echo "Unexpected privileged installation component: $component"
                exit 1
              fi
            done
            perms=$("$tools_dir/aapt" dump permissions "$apk")
            for permission in REQUEST_INSTALL_PACKAGES REQUEST_DELETE_PACKAGES UPDATE_PACKAGES_WITHOUT_USER_ACTION; do
              if grep -Fq "android.permission.$permission" <<< "$perms"; then
                echo "Unexpected Android package management permission: $permission"
                exit 1
              fi
            done
            echo "Verified single-app identity and signature: $(basename "$apk")"
          done
          (cd upstream/app/build/outputs/apk/foss && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Upload verified APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: mihon-nooir-foss-apk
          path: |
            upstream/app/build/outputs/apk/foss/*.apk
            upstream/app/build/outputs/apk/foss/SHA256SUMS.txt
          if-no-files-found: error