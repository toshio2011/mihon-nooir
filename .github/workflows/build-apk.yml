name: Build Mihon Nooir debug APK
on:
  workflow_dispatch:
  pull_request:
  push:
    # Temporary experimental-branch build until this stacked draft is validated.
    branches: [main, feature/pdf-reflow-paragraph-dropcap]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
      - name: Validate overlay structure
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate XTC, XTCH, EPUB and CBZ export formats
        run: |
          command -v kotlinc
          bash tests/run.sh
      - name: Read upstream pin
        id: pin
        run: echo "sha=$(cat config/mihon-upstream.sha)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Mihon upstream
        uses: actions/checkout@v4
        with:
          repository: mihonapp/mihon
          ref: ${{ steps.pin.outputs.sha }}
          path: upstream
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply integration
        run: python3 tools/apply_overlay.py upstream
      - name: Assemble fork (FOSS APK)
        working-directory: upstream
        run: bash ./gradlew :app:assembleFoss -Pdist=foss -Pinclude-telemetry=false --no-daemon --stacktrace
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihon-nooir-foss-apk
          path: upstream/app/build/outputs/apk/foss/*.apk
          if-no-files-found: warn