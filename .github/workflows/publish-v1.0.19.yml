name: Publish approved MihonNooir v1.0.19 RC2
# One-time, owner-approved promotion of the already-tested signed artifact.
on:
  push:
    branches: [main]
    paths:
      - docs/releases/v1.0.19.md
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: mihonnooir-v1.0.19-official-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'toshio2011/mihon-nooir' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RC: 403bd0e631832a9ac2ffebd18439612e36f9f37d
      RUN_ID: '44450814868'
      ARTIFACT_ID: '14495886989'
      ARTIFACT_DIGEST: '6b3cc59cfea88c653e56aeaf2e2fda7e4a94b2d3997323f0d127f786ffbb9bd9'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm approved RC2 source and completed verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat config/version.txt | tr -d '\r\n')" = '1.0.19'
          git diff --exit-code "$RC" HEAD -- . ':!README.md' ':!docs/releases/v1.0.19.md' ':!.github/workflows/publish-v1.0.19.yml'
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$RC"
          for run in 44450823995 44450824030; do
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .head_sha)" = "$RC"
          done
          if gh release view v1.0.19 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite.' >&2; exit 1
          fi
          test -z "$(git ls-remote --tags origin refs/tags/v1.0.19)"
      - name: Retrieve exact verified RC2 artifact
        shell: bash
        run: |
          set -euo pipefail
          meta=$(gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID")
          jq -e --arg sha "$RC" --arg name "mihonnooir-v1.0.19-signed-upgrade-candidate" --arg digest "sha256:$ARTIFACT_DIGEST" --argjson run "$RUN_ID" '.expired == false and .name == $name and .digest == $digest and .workflow_run.id == $run and .workflow_run.head_sha == $sha' <<< "$meta"
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/rc2.zip"
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$RUNNER_TEMP/rc2.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/rc2.zip" <<'PY'
          import pathlib, sys, zipfile
          names = {"app-" + a + "-foss.apk" for a in ("arm64-v8a","armeabi-v7a","universal","x86","x86_64")} | {"SHA256SUMS.txt"}
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert len(z.namelist()) == len(names) and set(z.namelist()) == names
              assert z.testzip() is None
              z.extractall("dist")
          lines = pathlib.Path("dist/SHA256SUMS.txt").read_text().splitlines()
          import re
          entries = [re.fullmatch(r"[0-9a-f]{64}  (?:\./)?(app-[\w-]+-foss\.apk)", line) for line in lines]
          assert all(entries) and len(entries)==5 and {m.group(1) for m in entries} == names - {"SHA256SUMS.txt"}
          PY
          (cd dist && sha256sum --strict -c SHA256SUMS.txt)
          printf '%s  %s\n' '16c1869ab7ce452ebd635d7f931a8c9d0728916e016dcf9195c61db4ccb6da97' dist/app-arm64-v8a-foss.apk | sha256sum -c -
      - name: Create draft and verify all uploaded assets before publication
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.19 dist/*-foss.apk dist/SHA256SUMS.txt --repo "$GH_REPO" --target "$GITHUB_SHA" --title 'MihonNooir v1.0.19 — Smarter Manga Reading' --notes-file docs/releases/v1.0.19.md --draft
          mkdir -p "$RUNNER_TEMP/uploaded"
          gh release download v1.0.19 --repo "$GH_REPO" --pattern '*' --dir "$RUNNER_TEMP/uploaded"
          for file in dist/*; do
            cmp "$file" "$RUNNER_TEMP/uploaded/$(basename "$file")"
          done
          test "$(gh release view v1.0.19 --repo "$GH_REPO" --json assets --jq '.assets | length')" = 6
          gh release edit v1.0.19 --repo "$GH_REPO" --draft=false --prerelease=false --latest
          gh release view v1.0.19 --repo "$GH_REPO" --json isDraft,isPrerelease,tagName,url,assets --jq 'select(.isDraft == false and .isPrerelease == false and .tagName == "v1.0.19" and (.assets | length) == 6) | .url' | grep -F '/releases/tag/v1.0.19'
