name: Build MihonNooir Windows desktop preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'overlay/app/src/main/java/dev/nooir/bridge/**'
      - 'overlay/app/src/main/java/dev/nooir/mangabridge/MangaConversionSettingsCore.kt'
      - 'tests/WindowsXtcBinaryPreviewTest.kt'
      - 'tests/DesktopXtcViewerSwingSmokeTest.kt'
      - 'tests/DesktopVisualRenderingPreviewTest.kt'
      - 'tests/ConanPanelRegressionTest.kt'
      - 'tests/DesktopGuiModelTest.kt'
      - 'tests/DesktopPanelExportTest.kt'
      - 'tests/PanelDetectionCoreTest.kt'
      - 'tests/DesktopWebpSmokeTest.kt'
      - 'tests/Desktop*.kt'
      - 'tests/test_overlay.py'
      - 'desktop/webp-runtime.pom'
      - 'desktop/webp-runtime.sha256'
      - 'tests/run.sh'
      - 'tests/run_windows_full.sh'
      - '.github/workflows/desktop-preview.yml'
  push:
    # Keep this isolated full-Windows branch testable before the workflow is merged.
    branches: [windows/integrated-v1.0.20-20261125]
    paths:
      - 'desktop/**'
      - 'overlay/app/src/main/java/dev/nooir/bridge/**'
      - 'overlay/app/src/main/java/dev/nooir/mangabridge/MangaConversionSettingsCore.kt'
      - 'tests/WindowsXtcBinaryPreviewTest.kt'
      - 'tests/DesktopXtcViewerSwingSmokeTest.kt'
      - 'tests/DesktopVisualRenderingPreviewTest.kt'
      - 'tests/ConanPanelRegressionTest.kt'
      - 'tests/DesktopGuiModelTest.kt'
      - 'tests/DesktopPanelExportTest.kt'
      - 'tests/PanelDetectionCoreTest.kt'
      - 'tests/DesktopWebpSmokeTest.kt'
      - 'tests/Desktop*.kt'
      - 'tests/test_overlay.py'
      - 'desktop/webp-runtime.pom'
      - 'desktop/webp-runtime.sha256'
      - 'tests/run.sh'
      - 'tests/run_windows_full.sh'
      - '.github/workflows/desktop-preview.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard Android integration against unintended source changes
        shell: bash
        run: |
          set -euo pipefail
          # Strict frozen public Android baseline; only Windows-owned files and reviewed test adapters may differ.
          base=72baf818aa4d26b5d33cffae8259200913a3a781
          git merge-base --is-ancestor "$base" HEAD
          changed=$(git diff --name-only "$base" HEAD)
          unexpected=$(printf '%s\n' "$changed" | grep -v -E '^(desktop/|docs/WINDOWS[^/]*\.md$|tests/(Desktop[^/]*\.kt|Windows[^/]*\.kt|SuwayomiBrowseTest\.kt|run_windows_full\.sh|run\.sh|test_overlay\.py)$|\.github/workflows/desktop-preview\.yml$|$)' || true)
          test -z "$unexpected" || { printf 'STOP: unexpected changes:\n%s\n' "$unexpected" >&2; exit 1; }
          git diff --exit-code "$base" HEAD -- overlay/ config/ tools/ .github/workflows/build-apk.yml .github/workflows/release-apk.yml .github/workflows/publish-v1.0.20.yml .github/workflows/verify-v1.0.20-signing.yml
          echo 'PASS: exact released Android v1.0.20 source and signing/release workflows preserved'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download checksum-pinned Windows-only Apache PDFBox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/desktop/lib
          curl --fail --location --retry 2 --max-time 180 \
            https://downloads.apache.org/pdfbox/3.0.8/pdfbox-app-3.0.8.jar \
            --output build/desktop/lib/pdfbox-app-3.0.8.jar
          sha512sum -c desktop/pdfbox-runtime.sha512
      - name: Compile portable desktop UI and shared Android conversion core
        shell: bash
        run: |
          set -euo pipefail
          command -v kotlinc
          grep -Fxq '    const val CURRENT_VERSION = "'"$(cat desktop/windows-version.txt)"'"' desktop/ui/DesktopWindowsUpdates.kt
          mkdir -p build/desktop
          kotlinc -classpath "$PWD/build/desktop/lib/pdfbox-app-3.0.8.jar" \
            overlay/app/src/main/java/dev/nooir/bridge/{XtcCodec.kt,XtcBookPreview.kt,ExportFormats.kt,NooirDeviceProfiles.kt,BookArchiveWriter.kt,Epub2Writer.kt,GrayscaleConverter.kt,GrayscalePng.kt,NaturalPageOrder.kt,PageSlicePlanner.kt,PanelContextPeek.kt,PanelDetectionCore.kt,PanelViewportPlanner.kt,PanelAutoFit.kt,PanelWhitespaceCrop.kt,PanelSafeSlicePlanner.kt,PanelReadableSliceRefiner.kt,XteinkTransferPolicy.kt,ReflowEpubWriter.kt,NooirEpubCssRules.kt} \
            overlay/app/src/main/java/dev/nooir/mangabridge/{MangaConversionSettingsCore.kt,NooirEpubBook.kt,NooirCoverCollageLayout.kt,NooirWebImageProfile.kt,NooirWebChapterPlan.kt,NooirWebChapterIdentity.kt,NooirWebChapterUpdates.kt} \
            desktop/cli/*.kt desktop/suwayomi/*.kt desktop/ui/*.kt desktop/storage/*.kt \
            -include-runtime -d build/desktop/mihonnooir-desktop-preview.jar
      - name: Bundle pinned pure-Java WebP decoder in the standalone Windows JAR
        shell: bash
        run: |
          set -euo pipefail
          # Libraries are resolved at BUILD time, not on user machines.
          # No Android/firmware source or dependency is touched.
          mvn -B -ntp -f desktop/webp-runtime.pom \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
            -DincludeScope=runtime -DoutputDirectory="$PWD/build/desktop/lib"
          for name in imageio-webp imageio-core imageio-metadata common-lang common-io common-image; do
            test -s "build/desktop/lib/$name-3.15.3.jar" ||
              { echo "Missing pinned WebP runtime: $name" >&2; exit 1; }
          done
          # Lock the actual resolved JAR bytes, not only Maven coordinates.
          # Fail closed on a modified/transient artifact or unreviewed update.
          sha256sum -c desktop/webp-runtime.sha256
          # Java's JAR manifest Class-Path is also honored by jpackage's
          # launcher; this keeps the existing Kotlin JAR and CLI entry points.
          classpath=$(find build/desktop/lib -maxdepth 1 -name '*.jar' -printf 'lib/%f\n' |
            LC_ALL=C sort | paste -sd ' ' -)
          printf 'Manifest-Version: 1\nClass-Path: %s\n' "$classpath" > build/desktop/webp-manifest.mf
          jar ufm build/desktop/mihonnooir-desktop-preview.jar build/desktop/webp-manifest.mf
          unzip -p build/desktop/mihonnooir-desktop-preview.jar META-INF/MANIFEST.MF |
            grep -q 'Class-Path:'
      - name: Verify headless UI model and Suwayomi mock integration
        shell: bash
        env:
          NOOIR_OUTPUT_DIR: tests/generated
        run: |
          set -euo pipefail
          bash tests/run.sh
          # Exercise a live Swing JDialog under a virtual display on Linux CI.
          # Actual Windows app packaging retains a separate Windows runner.
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          NOOIR_DESKTOP_GUI_SMOKE=1 bash tests/run_windows_full.sh
      - name: Compile standalone GUI acceptance test against the production desktop JAR
        shell: bash
        run: |
          set -euo pipefail
          # Keep test bytecode OUT of the distributable app. Friend paths let the
          # test inspect the same internal dialog API used by the production toolbar.
          app="$PWD/build/desktop/mihonnooir-desktop-preview.jar"
          mkdir -p build/windows-gui-qa
          kotlinc -classpath "$app:$PWD/build/desktop/lib/pdfbox-app-3.0.8.jar" -Xfriend-paths="$app" \
            tests/DesktopXtcViewerSwingSmokeTest.kt tests/DesktopConversionQueueTest.kt tests/DesktopDocumentImportTest.kt tests/DesktopInstalledDataTest.kt \
            -d build/windows-gui-qa/viewer-smoke.jar
          test -s build/windows-gui-qa/viewer-smoke.jar
      - name: Retain GUI acceptance test separately from distributable code
        uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-windows-gui-qa-test
          path: build/windows-gui-qa/viewer-smoke.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload synthetic rendering comparison for human inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-visual-four-modes-xtc-xtch
          path: |
            tests/generated/Nooir_Visual_4Modes_XTC_XTCH.png
            tests/generated/Nooir_Visual_Source_Synthetic.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-desktop-preview-jvm
          path: |
            build/desktop/mihonnooir-desktop-preview.jar
            build/desktop/lib/*.jar
          if-no-files-found: error
          retention-days: 14
  windows-app-image:
    needs: build-jvm
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: mihonnooir-desktop-preview-jvm
          path: package/input
      - uses: actions/download-artifact@v4
        with:
          name: mihonnooir-windows-gui-qa-test
          path: package/qa
      - name: Create bundled-runtime Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # jpackage's default jlink image intentionally strips native
          # commands (including java.exe). The managed Suwayomi backend needs
          # an actual Java launcher from the SAME runtime as the desktop app.
          # Keep all JDK modules until a real Suwayomi integration smoke test
          # proves a smaller compatible module set.
          & "$env:JAVA_HOME/bin/jlink.exe" --add-modules ALL-MODULE-PATH --output package/full-runtime --strip-debug --no-man-pages --no-header-files
          if ($LASTEXITCODE -ne 0) { throw "jlink failed: $LASTEXITCODE" }
          if (!(Test-Path 'package/full-runtime/bin/java.exe')) { throw 'Explicit runtime is missing java.exe' }
          $version = (Get-Content desktop/windows-version.txt -Raw).Trim()
          jpackage --type app-image --name MihonNooir-Preview --app-version $version --input package/input --main-jar mihonnooir-desktop-preview.jar --main-class dev.nooir.desktop.ui.MangaNooirDesktop --runtime-image package/full-runtime --dest package/output --java-options '-Dfile.encoding=UTF-8'
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed: $LASTEXITCODE" }
          $app = 'package/output/MihonNooir-Preview'
          if (!(Test-Path "$app/MihonNooir-Preview.exe")) { throw 'Windows launcher missing from app image' }
          if (!(Test-Path "$app/app")) { throw 'Packaged application files missing' }
          if (!(Test-Path "$app/runtime")) { throw 'Bundled Java runtime missing' }
          if (!(Test-Path "$app/runtime/bin/java.exe")) { throw 'Bundled Java launcher missing for managed Suwayomi backend' }
          if (!(Test-Path "$app/app/lib/imageio-webp-3.15.3.jar")) { throw 'WebP decoder missing from Windows app image' }
          if (!(Test-Path "$app/app/lib/pdfbox-app-3.0.8.jar")) { throw 'PDFBox missing from Windows app image' }
          Compress-Archive -Path $app -DestinationPath package/MihonNooir-Windows-Preview.zip -CompressionLevel Optimal
          if (!(Test-Path package/MihonNooir-Windows-Preview.zip)) { throw 'Windows archive missing' }
          $hash = (Get-FileHash -Algorithm SHA256 'package/MihonNooir-Windows-Preview.zip').Hash.ToLowerInvariant()
          Set-Content -Path 'package/MihonNooir-Windows-Preview.zip.sha256' -Encoding ascii -NoNewline -Value "$hash  MihonNooir-Windows-Preview.zip"
          Write-Host "Portable Windows ZIP SHA256: $hash"
      - name: Smoke test bundled Windows runtime with an offline EPUB 2 conversion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'package/output/MihonNooir-Preview'
          $runtime = Join-Path $app 'runtime/bin/java.exe'
          $jar = Join-Path $app 'app/mihonnooir-desktop-preview.jar'
          if (!(Test-Path $runtime) -or !(Test-Path $jar)) {
            throw 'Packaged runtime or application JAR missing'
          }

          Add-Type -AssemblyName System.Drawing
          $sample = Join-Path $env:RUNNER_TEMP 'mihonnooir-smoke-pages'
          New-Item -ItemType Directory -Force -Path $sample | Out-Null
          $png = Join-Path $sample '001.png'
          $bitmap = [System.Drawing.Bitmap]::new(128, 192)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          try {
            $graphics.Clear([System.Drawing.Color]::White)
            $graphics.FillRectangle([System.Drawing.Brushes]::Black, 10, 10, 108, 75)
            $bitmap.Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally {
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          $output = Join-Path $env:RUNNER_TEMP 'MihonNooir-packaged-runtime-smoke.epub'
          & $runtime '-Djava.awt.headless=true' '-cp' $jar 'dev.nooir.desktop.NooirDesktopCli' '--input' $sample '--output' $output '--format' 'EPUB2' '--device' 'X4' '--title' 'CI original page'
          if ($LASTEXITCODE -ne 0) { throw "Packaged converter failed: $LASTEXITCODE" }
          if (!(Test-Path $output) -or ((Get-Item $output).Length -lt 100)) {
            throw 'Bundled Windows runtime did not produce a nonempty EPUB'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($output)
          try {
            if (!($zip.Entries | Where-Object { $_.FullName -eq 'mimetype' })) {
              throw 'Packaged EPUB missing its mimetype entry'
            }
          } finally {
            $zip.Dispose()
          }
          Write-Host 'Packaged Windows JVM converted original local PNG to EPUB 2 successfully'
      - name: Smoke test all five formats from packaged Windows JVM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'package/output/MihonNooir-Preview'
          $runtime = Join-Path $app 'runtime/bin/java.exe'
          $jar = Join-Path $app 'app/mihonnooir-desktop-preview.jar'
          $sample = Join-Path $env:RUNNER_TEMP 'mihonnooir-smoke-pages'
          if (!(Test-Path $runtime) -or !(Test-Path $jar) -or !(Test-Path (Join-Path $sample '001.png'))) {
            throw 'Packaged JVM, app or original PNG fixture missing'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $cases = @(
            @{ Format = 'XTC'; Ext = 'xtc' },
            @{ Format = 'XTCH'; Ext = 'xtch' },
            @{ Format = 'EPUB2'; Ext = 'epub' },
            @{ Format = 'EPUB'; Ext = 'epub' },
            @{ Format = 'CBZ'; Ext = 'cbz' }
          )
          foreach ($case in $cases) {
            $format = $case.Format
            $output = Join-Path $env:RUNNER_TEMP ("nooir-packaged-" + $format + "." + $case.Ext)
            if (Test-Path $output) { throw "Unexpected existing test output for $format" }
            & $runtime '-Djava.awt.headless=true' '-cp' $jar 'dev.nooir.desktop.NooirDesktopCli' '--input' $sample '--output' $output '--format' $format '--device' 'X4' '--title' 'Original CI fixture'
            if ($LASTEXITCODE -ne 0) { throw "Packaged $format conversion failed: $LASTEXITCODE" }
            if (!(Test-Path $output) -or (Get-Item $output).Length -le 100) {
              throw "Packaged $format conversion produced no meaningful output"
            }
            if ($format -eq 'XTC' -or $format -eq 'XTCH') {
              $bytes = [System.IO.File]::ReadAllBytes($output)
              if ([System.Text.Encoding]::ASCII.GetString($bytes, 0, 3) -ne 'XTC') {
                throw "Packaged $format has invalid XTC container signature"
              }
              if ([BitConverter]::ToUInt16($bytes, 6) -ne 1) {
                throw "Packaged $format has wrong page count"
              }
            } else {
              $zip = [System.IO.Compression.ZipFile]::OpenRead($output)
              try {
                $names = @($zip.Entries | ForEach-Object { $_.FullName })
                if ($format -eq 'CBZ') {
                  if ($names -notcontains 'ComicInfo.xml') { throw 'Packaged CBZ has no ComicInfo.xml' }
                } else {
                  if ($names[0] -ne 'mimetype' -or $names -notcontains 'OEBPS/package.opf') {
                    throw "Packaged $format EPUB has invalid container structure"
                  }
                  $nav = if ($format -eq 'EPUB2') { 'OEBPS/toc.ncx' } else { 'OEBPS/nav.xhtml' }
                  if ($names -notcontains $nav) { throw "Packaged $format has no expected navigation document" }
                }
              } finally {
                $zip.Dispose()
              }
            }
            Write-Host "PASS: bundled Windows runtime generated a valid $format output from original PNG"
          }
      - name: Smoke test an original WebP CBZ using packaged Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $app = 'package/output/MihonNooir-Preview'
          $runtime = Join-Path $app 'runtime/bin/java.exe'
          $jar = Join-Path $app 'app/mihonnooir-desktop-preview.jar'
          # Small original synthetic 64x96 WebP, no third-party scans.
          $bytes = [Convert]::FromBase64String('UklGRn4AAABXRUJQVlA4IHIAAADwBQCdASpAAGAAPj0ai0OiIaEWBAAgA8S0gAIYz/EAUpzk2fD0PaNPZCMdhtTUJcjqh1tXLad8AAD+/ERBoP/4n8f/lYAAH7/qR//7X//+l1wP4Txi3GqiQHj/J/4g/7A+f/5X6d4yy2UYWMz/xergAAA=')
          $inputZip = Join-Path $env:RUNNER_TEMP 'nooir-webp-smoke.cbz'
          $zip = [IO.Compression.ZipFile]::Open($inputZip, [IO.Compression.ZipArchiveMode]::Create)
          try {
            $entry = $zip.CreateEntry('001.webp')
            $stream = $entry.Open()
            try { $stream.Write($bytes, 0, $bytes.Length) } finally { $stream.Dispose() }
          } finally { $zip.Dispose() }
          $out = Join-Path $env:RUNNER_TEMP 'nooir-packaged-webp.xtch'
          & $runtime '-Djava.awt.headless=true' '-cp' $jar 'dev.nooir.desktop.NooirDesktopCli' '--input' $inputZip '--output' $out '--format' 'XTCH' '--device' 'X4'
          if ($LASTEXITCODE -ne 0) { throw "Bundled Windows runtime cannot decode WebP CBZ: $LASTEXITCODE" }
          if (!(Test-Path $out)) { throw 'WebP CBZ produced no XTCH output' }
          $result = [IO.File]::ReadAllBytes($out)
          if ([BitConverter]::ToUInt16($result, 6) -ne 1) { throw 'WebP CBZ output did not contain one page' }
          Write-Host 'PASS: packaged Java runtime opened original WebP CBZ and wrote XTCH'
      - name: Launch the real packaged Windows EXE without a backend
        shell: pwsh
        timeout-minutes: 3
        run: |
          & ./desktop/windows/verify-launcher.ps1 -ExePath 'package/output/MihonNooir-Preview/MihonNooir-Preview.exe'
      - name: Exercise real saved-book Swing viewer on the packaged Windows runtime
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'package/output/MihonNooir-Preview'
          $runtime = Join-Path $app 'runtime/bin/java.exe'
          $jar = Join-Path $app 'app/mihonnooir-desktop-preview.jar'
          $qa = 'package/qa/viewer-smoke.jar'
          if (!(Test-Path $runtime) -or !(Test-Path $jar) -or !(Test-Path $qa)) {
            throw 'Production packaged runtime, JAR or separate GUI QA JAR missing'
          }
          # These are Java2D scale overrides on a hosted Windows runner, not
          # physical multi-monitor/DPI acceptance or manual click-through.
          $classpath = "$jar;$qa"
          foreach ($scale in @('1.0','1.25','1.5')) {
            Write-Host "Windows packaged Swing acceptance at requested Java2D scale $scale"
            $qaHome = Join-Path $env:RUNNER_TEMP ('nooir-gui-qa-' + [guid]::NewGuid().ToString())
            $previousHome = $env:MIHONNOOIR_DATA_DIR
            try {
              $env:MIHONNOOIR_DATA_DIR = $qaHome
              $screens = Join-Path (Get-Location) "package/gui-screenshots/scale-$scale"
              & $runtime '-Djava.awt.headless=false' '-Dnooir.test.offlineLibrary=true' "-Dsun.java2d.uiScale=$scale" "-Dnooir.test.expectedUiScale=$scale" "-Dnooir.test.screenshotDir=$screens" '-cp' $classpath 'dev.nooir.desktop.ui.DesktopXtcViewerSwingSmokeTestKt'
              if ($LASTEXITCODE -ne 0) { throw "Packaged Windows GUI smoke failed at scale $scale ($LASTEXITCODE)" }
            } finally {
              $env:MIHONNOOIR_DATA_DIR = $previousHome
              if (Test-Path -LiteralPath $qaHome) { Remove-Item -LiteralPath $qaHome -Recurse -Force }
            }
          }
          Write-Host 'PASS: packaged Windows runtime saved-book viewer at 100/125/150% requested Java2D scales'
      - name: Retain actual packaged Windows GUI test captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-windows-gui-screenshots
          path: package/gui-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Test document import and persistent jobs against the packaged Windows runtime
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'package/output/MihonNooir-Preview'
          $java = Join-Path $app 'runtime/bin/java.exe'
          $jar = Join-Path $app 'app/mihonnooir-desktop-preview.jar'
          $qa = 'package/qa/viewer-smoke.jar'
          $cp = "$jar;$qa"
          foreach ($test in @('DesktopConversionQueueTestKt','DesktopDocumentImportTestKt')) {
            & $java '-Djava.awt.headless=true' '-cp' $cp "dev.nooir.desktop.ui.$test"
            if ($LASTEXITCODE -ne 0) { throw "Packaged Windows $test failed ($LASTEXITCODE)" }
          }
          Write-Host 'PASS: packaged Windows runtime document and persistent queue regression'
      - name: Create versioned unsigned per-user MSI from verified application image
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/windows-version.txt -Raw).Trim()
          $wix = if ($env:WIX) { Join-Path $env:WIX 'bin' } else { "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" }
          if (Test-Path (Join-Path $wix 'candle.exe')) { $env:PATH = "$wix;$env:PATH" }
          Get-Command candle.exe -ErrorAction Stop | Out-Null
          Get-Command light.exe -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Force package/installer | Out-Null
          jpackage --type msi --name MihonNooir-Preview --app-version $version --app-image package/output/MihonNooir-Preview --dest package/installer --vendor MihonNooir --win-per-user-install --win-menu --win-shortcut --win-upgrade-uuid '8441c7aa-d895-4f1d-bd3b-c99ee8eb5872'
          if ($LASTEXITCODE -ne 0) { throw "MSI packaging failed: $LASTEXITCODE" }
          $msi = @(Get-ChildItem package/installer -Filter *.msi)
          if ($msi.Count -ne 1) { throw 'Expected exactly one MSI' }
          $releaseName = "MihonNooir-Windows-$version-x64"
          Move-Item -LiteralPath $msi[0].FullName -Destination "package/$releaseName.msi"
          Copy-Item -LiteralPath package/MihonNooir-Windows-Preview.zip -Destination "package/$releaseName.zip"
          Get-AuthenticodeSignature "package/$releaseName.msi" | Format-List Status,StatusMessage
          $lines = foreach ($ext in @('msi','zip')) {
            $name = "$releaseName.$ext"
            $hash = (Get-FileHash -Algorithm SHA256 "package/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          Set-Content -Path package/SHA256SUMS-windows.txt -Encoding ascii -Value $lines
      - name: Exercise MSI synthetic version upgrade and actual user-state survival
        shell: pwsh
        timeout-minutes: 18
        run: |
          & ./desktop/windows/verify-installed-data.ps1 -PackageRoot 'package' -QaJar 'package/qa/viewer-smoke.jar'
      - uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-windows-preview-unsigned
          path: |
            package/MihonNooir-Windows-Preview.zip
            package/MihonNooir-Windows-Preview.zip.sha256
            package/MihonNooir-Windows-*-x64.msi
            package/MihonNooir-Windows-*-x64.zip
            package/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  real-suwayomi-server:
    needs: windows-app-image
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download same-run packaged Windows preview
        uses: actions/download-artifact@v4
        with:
          name: mihonnooir-windows-preview-unsigned
          path: real-server-smoke
      - name: Verify portable preview archive and unpack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'real-server-smoke/MihonNooir-Windows-Preview.zip'
          $shaFile = 'real-server-smoke/MihonNooir-Windows-Preview.zip.sha256'
          if (!(Test-Path $archive) -or !(Test-Path $shaFile)) { throw 'Missing packaged preview or SHA-256' }
          $expected = ((Get-Content $shaFile -Raw).Trim().Split(' '))[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Packaged preview failed checksum verification' }
          Expand-Archive -Path $archive -DestinationPath 'real-server-smoke/unpacked'
          $base = 'real-server-smoke/unpacked/MihonNooir-Preview'
          if (!(Test-Path "$base/runtime/bin/java.exe") -or
              !(Test-Path "$base/app/mihonnooir-desktop-preview.jar")) {
            throw 'Downloaded preview is missing bundled Java or shared conversion code'
          }
      - name: Download and verify pinned official Suwayomi server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Suwayomi/Suwayomi-Server/releases/download/v2.4.2366/Suwayomi-Server-v2.4.2366.jar'
          $dest = Join-Path $env:RUNNER_TEMP 'Suwayomi-Server-v2.4.2366.jar'
          & curl.exe --fail --location --retry 2 --connect-timeout 25 --max-time 360 --output $dest $url
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $dest)) { throw 'Official Suwayomi download failed' }
          $hash = (Get-FileHash -Algorithm SHA256 $dest).Hash.ToLowerInvariant()
          if ($hash -ne 'af9feb20af9d7ebe9e30769e6c6ebc7fc7ab1c447388d42e0280b1da5fe07bfd') {
            throw 'Official Suwayomi JAR checksum mismatch'
          }
      - name: Start real pinned Suwayomi, query GraphQL, and shut down owned process
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'real-server-smoke/unpacked/MihonNooir-Preview'
          $runtime = Join-Path $base 'runtime/bin/java.exe'
          $appJar = Join-Path $base 'app/mihonnooir-desktop-preview.jar'
          $suwayomiJar = Join-Path $env:RUNNER_TEMP 'Suwayomi-Server-v2.4.2366.jar'
          & $runtime '-Djava.awt.headless=true' '-cp' $appJar 'dev.nooir.desktop.suwayomi.RealSuwayomiServerSmoke' $suwayomiJar
          if ($LASTEXITCODE -ne 0) { throw "Real Suwayomi integration failed: $LASTEXITCODE" }

  native-desktop-matrix:
    name: Native desktop (${{ matrix.platform }}-${{ matrix.arch }})
    needs: build-jvm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            java_arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            java_arch: aarch64
          - runner: macos-15-intel
            platform: macos
            arch: x64
            java_arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
            java_arch: aarch64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            java_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_arch }}
      - uses: actions/download-artifact@v4
        with:
          name: mihonnooir-desktop-preview-jvm
          path: package/input
      - uses: actions/download-artifact@v4
        with:
          name: mihonnooir-windows-gui-qa-test
          path: package/qa
      - name: Install Linux virtual display prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgtk-3-0t64 libxtst6 libxi6 libxrender1 fonts-dejavu-core
      - name: Build and exercise native portable desktop preview
        shell: bash
        run: python3 desktop/verify_native_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Download exact pinned real Suwayomi server
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 360 \
            https://github.com/Suwayomi/Suwayomi-Server/releases/download/v2.4.2366/Suwayomi-Server-v2.4.2366.jar \
            --output package/Suwayomi-Server-v2.4.2366.jar
      - name: Verify real server integration from bundled runtime
        shell: bash
        run: python3 desktop/verify_native_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --server-only
      - name: Upload platform-specific test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-qa-${{ matrix.platform }}-${{ matrix.arch }}
          path: package/native-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain verified unsigned native portable preview
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: package/native-dist/
          if-no-files-found: error
          retention-days: 14
