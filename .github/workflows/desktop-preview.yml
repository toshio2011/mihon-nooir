name: Build MangaNooir Windows desktop preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'overlay/app/src/main/java/dev/nooir/bridge/**'
      - 'overlay/app/src/main/java/dev/nooir/mangabridge/MangaConversionSettingsCore.kt'
      - 'tests/DesktopGuiModelTest.kt'
      - 'tests/run.sh'
      - '.github/workflows/desktop-preview.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'overlay/app/src/main/java/dev/nooir/bridge/**'
      - 'overlay/app/src/main/java/dev/nooir/mangabridge/MangaConversionSettingsCore.kt'
      - 'tests/DesktopGuiModelTest.kt'
      - 'tests/run.sh'
      - '.github/workflows/desktop-preview.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile portable desktop UI and shared Android conversion core
        shell: bash
        run: |
          set -euo pipefail
          command -v kotlinc
          mkdir -p build/desktop
          kotlinc \
            overlay/app/src/main/java/dev/nooir/bridge/{XtcCodec.kt,ExportFormats.kt,NooirDeviceProfiles.kt,BookArchiveWriter.kt,Epub2Writer.kt,GrayscaleConverter.kt,GrayscalePng.kt,NaturalPageOrder.kt,PageSlicePlanner.kt} \
            overlay/app/src/main/java/dev/nooir/mangabridge/MangaConversionSettingsCore.kt \
            desktop/cli/NooirDesktopCli.kt desktop/suwayomi/*.kt desktop/ui/*.kt \
            -include-runtime -d build/desktop/manganooir-desktop-preview.jar
      - name: Verify headless UI model and Suwayomi mock integration
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: manganooir-desktop-preview-jvm
          path: build/desktop/manganooir-desktop-preview.jar
          if-no-files-found: error
          retention-days: 14
  windows-app-image:
    needs: build-jvm
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: manganooir-desktop-preview-jvm
          path: package/input
      - name: Create bundled-runtime Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          jpackage --type app-image --name MangaNooir-Preview --input package/input --main-jar manganooir-desktop-preview.jar --main-class dev.nooir.desktop.ui.MangaNooirDesktop --dest package/output --java-options '-Dfile.encoding=UTF-8'
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed: $LASTEXITCODE" }
          Compress-Archive -Path package/output/MangaNooir-Preview -DestinationPath package/MangaNooir-Windows-Preview.zip -CompressionLevel Optimal
          if (!(Test-Path package/MangaNooir-Windows-Preview.zip)) { throw 'Windows archive missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: manganooir-windows-preview-unsigned
          path: package/MangaNooir-Windows-Preview.zip
          if-no-files-found: error
          retention-days: 14
