name: Desktop Compose UI experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/compose-preview/**'
      - '.github/workflows/desktop-compose-experiment.yml'
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Compile isolated Compose UI
        run: gradle -p desktop/compose-preview compileKotlin --no-daemon --stacktrace
