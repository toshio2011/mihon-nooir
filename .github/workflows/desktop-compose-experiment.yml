name: Desktop Compose UI experiment
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/compose-preview/**'
      - '.github/workflows/desktop-compose-experiment.yml'
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Compile isolated Compose UI
        run: gradle -p desktop/compose-preview compileKotlin --no-daemon --stacktrace
  capture-library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Install isolated GUI capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool imagemagick python3-pil
      - name: Launch real Compose UI and capture library
        run: |
          bash -n desktop/compose-preview/qa/capture-library.sh
          xvfb-run -a -s '-screen 0 1440x900x24' bash desktop/compose-preview/qa/capture-library.sh
      - name: Upload actual Compose library capture and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-compose-library-visual
          path: compose-visual-evidence/
          if-no-files-found: warn

  windows-preview:
    needs: [compile, capture-library]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Create Windows Compose application image
        shell: pwsh
        run: |
          gradle -p desktop/compose-preview createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Compose packaging failed" }
          $image = 'desktop/compose-preview/build/compose/binaries/main/app/MihonNooir-Compose-Preview'
          if (!(Test-Path "$image/MihonNooir-Compose-Preview.exe")) { throw "Missing Compose launcher" }
          $source = $env:JAVA_HOME
          if (!(Test-Path "$source/bin/java.exe")) { throw "Missing Java 21 runtime" }
          Copy-Item -LiteralPath $source -Destination "$image/backend-java" -Recurse
          if (!(Test-Path "$image/backend-java/bin/java.exe")) { throw "Missing backend launcher" }
          & "$image/backend-java/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "Backend runtime failed" }
          $commit = git rev-parse HEAD
          "Experimental preview; commit $commit. No real device acceptance yet." | Set-Content "$image/PREVIEW.txt"
          Compress-Archive -Path $image -DestinationPath MihonNooir-Compose-Windows-Preview.zip
      - name: Upload portable Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: mihonnooir-compose-windows-preview
          path: MihonNooir-Compose-Windows-Preview.zip
          if-no-files-found: error
