name: Sync v1.0.11 prerelease notes

# Only synchronize the existing v1.0.11 release description.
# Never replace APK assets, alter its prerelease status, or publish new versions.
on:
  push:
    branches: [main]
    paths:
      - docs/releases/v1.0.11.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/releases/v1.0.11.md
          gh release view v1.0.11 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit v1.0.11 --repo "$GITHUB_REPOSITORY" --notes-file docs/releases/v1.0.11.md
